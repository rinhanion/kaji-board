<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ごほうび</title>
  <meta name="theme-color" content="#F8FAFD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13171E" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="screen stats">
    <header class="stats-head">
      <a href="/" class="back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        ボード
      </a>
      <h1 class="title">ごほうび</h1>
      <p id="rate" class="date"></p>
    </header>

    <p id="loading" class="hint">読み込み中…</p>
    <p id="error" class="offline" hidden></p>

    <div id="content" hidden>
      <ul id="people" class="reward-people"></ul>
      <p class="note">家事 1回で 1ポイント、「ありがとう」を 1つもらうと 1ポイント。今日の分も入っています</p>

      <section class="stat-sec">
        <h2>使った記録</h2>
        <ul id="uses" class="uses"></ul>
      </section>
    </div>
  </main>

  <!-- ポイントを使う -->
  <dialog id="use-dialog" class="sheet">
    <form id="use-form" method="dialog">
      <h2 id="use-title"></h2>
      <p id="use-hint" class="hint"></p>
      <div class="use-input">
        <input id="use-points" type="number" inputmode="numeric" min="1" step="1" required aria-label="使うポイント" enterkeyhint="done">
        <span>ポイント</span>
        <button id="use-all" type="button" class="btn">ぜんぶ</button>
      </div>
      <p id="use-yen" class="use-yen"></p>
      <p id="use-error" class="error" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" class="btn" data-close>やめる</button>
        <button id="use-ok" type="submit" class="btn primary">使う</button>
      </div>
    </form>
  </dialog>

  <script src="/rewards.js"></script>
</body>
</html>
